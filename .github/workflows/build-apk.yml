name: Build Stay Radar APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - "payload/**"
      - ".github/workflows/build-apk.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Rebuild Android project
        run: |
          cat payload/part_* | base64 -d > stay-radar-source.zip
          unzip -q stay-radar-source.zip
          test -f stay_radar_android/settings.gradle

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build APK
        working-directory: stay_radar_android
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          cp stay_radar_android/app/build/outputs/apk/debug/app-debug.apk StayRadar.apk

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: StayRadar-Android
          path: StayRadar.apk
          if-no-files-found: error
